            {
                question: "ในขั้นตอนสังเคราะห์สถาปัตยกรรม 'การนำออก' (ตัดเสร็จแล้ว) ถูกออกแบบไว้อย่างไร?",
                options: ["ใช้มอเตอร์ดึงใบมีดกลับ", "ใบมีดต้องเด้งกลับอัตโนมัติด้วยสปริง", "ผู้ใช้ต้องใช้มือดึงใบมีดขึ้นเอง", "ปล่อยให้ท่อตกลงตามแรงโน้มถ่วง"],
                answer: 1,
                explanation: "หน้า 9 ระบุว่า การนำออก 'ตัดเสร็จแล้วใบมีดต้องเด้งกลับอัตโนมัติด้วยสปริง'"
            },
            {
                question: "จากการวิเคราะห์กลศาสตร์ ใบมีดสแตนเลส (Blade) ต้องทนทานต่อแรงประเภทใดเป็นหลัก?",
                options: ["แรงดึง (Tension)", "แรงเฉือน (Shear)", "แรงดัด (Bending Force)", "แรงบิด (Torsion)"],
                answer: 2,
                explanation: "หน้า 10 ระบุว่า ใบมีดสแตนเลส ต้องทน 'แรงดัด (Bending Force)'"
            },
            {
                question: "สลักยึดที่เป็นจุดหมุนหลักของเครื่องตัดท่อ ต้องออกแบบมาให้รับแรงประเภทใด?",
                options: ["แรงเฉือน (Shear)", "แรงดึง (Tension)", "แรงดัด (Bending)", "แรงอัด (Compression)"],
                answer: 0,
                explanation: "หน้า 10 ระบุว่า สลักยึดจุดหมุนหลัก ต้องทน 'แรงเฉือน (Shear)'"
            },
            {
                question: "คานเท้าเหยียบที่รับน้ำหนักตัวผู้ใช้งาน จะเกิดแรงประเภทใดในโครงสร้าง?",
                options: ["แรงเฉือน (Shear)", "แรงดึง (Tension)", "แรงบิด (Torsion)", "แรงดัด (Bending)"],
                answer: 3,
                explanation: "หน้า 10 ระบุว่า คานเท้าเหยียบ รับ 'แรงดัด (Bending)' จากน้ำหนักตัวผู้ใช้งาน"
            },
            {
                question: "แกนดึงที่เชื่อมต่อกับคานเท้าเหยียบ ต้องออกแบบเพื่อรับแรงประเภทใด?",
                options: ["แรงดึง (Tension)", "แรงอัด (Compression)", "แรงเฉือน (Shear)", "แรงดัด (Bending)"],
                answer: 0,
                explanation: "หน้า 10 ระบุว่า แกนดึง รับ 'แรงดึง (Tension)' จากคานเท้าเหยียบ"
            },
            {
                question: "วิศวกรคำนวณวัสดุและขนาดของเครื่องตัดท่อ ย้อนกลับมาจากแรงต้านของท่อ PVC ที่มีค่าเท่าใด?",
                options: ["100 N", "250 N", "500 N", "1000 N"],
                answer: 1,
                explanation: "หน้า 10 ระบุว่า แรงต้านท่อ PVC = 250 N และวัสดุไม่ได้ถูกสุ่มเลือก แต่ถูกคำนวณย้อนกลับมาจากแรง 250 N นี้"
            },
            {
                question: "การจำลองการเคลื่อนที่และกลศาสตร์ (Simulation) มีประโยชน์อย่างไรในการออกแบบ?",
                options: ["ทำให้แบบดูสวยงามเวลาเสนอขาย", "ช่วยลดข้อผิดพลาดก่อนการสร้างชิ้นงานจริง", "ลดความจำเป็นในการคำนวณแรง", "เพิ่มความยุ่งยากให้กระบวนการทำงาน"],
                answer: 1,
                explanation: "หน้า 11 ระบุชัดเจนว่า 'การจำลองช่วยลดข้อผิดพลาดก่อนการสร้างชิ้นงานจริง และสามารถนำไปจัดทำคู่มือผู้ใช้ได้ทันที'"
            },
            {
                question: "เครื่องตัดท่อ PVC มีเป้าหมายหนึ่งคือ 'มือทั้งสองข้างต้องว่าง' เพื่อจุดประสงค์ใด?",
                options: ["เพื่อความปลอดภัย ไม่ให้มือโดนใบมีด", "เพื่อให้ผู้ใช้สามารถดื่มน้ำขณะทำงานได้", "เพื่อให้มือว่างสำหรับจับชิ้นงาน (ท่อ)", "เพื่อลดความเหนื่อยล้าของไหล่"],
                answer: 2,
                explanation: "หน้า 8 ระบุเป้าหมายว่า 'มือทั้งสองข้างต้องว่างเพื่อจับชิ้นงาน'"
            }
        ];

        // ตัวแปรเก็บสถานะของแอป
        let currentQuestionIndex = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let score = 0;

        // อ้างอิง Element
        const appContainer = document.getElementById('app');

        // ฟังก์ชั่นเริ่มโปรแกรม
        function init() {
            renderStartScreen();
        }

        // หน้าเริ่มแบบทดสอบ
        function renderStartScreen() {
            appContainer.innerHTML = `
                <div class="p-8 md:p-12 text-center fade-in">
                    <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-6">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                    </div>
                    <h1 class="text-2xl md:text-3xl font-bold text-slate-800 mb-4">แบบทดสอบที่ 1: แนวคิดการออกแบบเครื่องจักรกล</h1>
                    <p class="text-slate-600 mb-8 leading-relaxed">บททดสอบปรนัย 4 ตัวเลือก จำนวน ${quizData.length} ข้อ<br>เนื้อหาจากเอกสาร "จากความยุ่งเหยิงสู่ฟังก์ชันการใช้งาน"</p>
                    <button onclick="startQuiz()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded-full shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-1">
                        เริ่มทำแบบทดสอบ
                    </button>
                </div>
            `;
        }

        function startQuiz() {
            currentQuestionIndex = 0;
            userAnswers = new Array(quizData.length).fill(null);
            score = 0;
            renderQuestion();
        }

        // หน้าแสดงคำถาม
        function renderQuestion() {
            const data = quizData[currentQuestionIndex];
            const hasAnswered = userAnswers[currentQuestionIndex] !== null;
            const selectedIdx = userAnswers[currentQuestionIndex];
            const progressPct = ((currentQuestionIndex) / quizData.length) * 100;

            let optionsHtml = '';
            data.options.forEach((opt, idx) => {
                let btnStyle = "bg-white border-slate-200 text-slate-700 hover:border-blue-500 hover:bg-blue-50";
                
                // หากตอบแล้ว ให้เปลี่ยนสไตล์ปุ่ม
                if (hasAnswered) {
                    if (idx === data.answer) {
                        // ข้อที่ถูก
                        btnStyle = "bg-green-100 border-green-500 text-green-800 font-medium";
                    } else if (idx === selectedIdx && selectedIdx !== data.answer) {
                        // ข้อที่เลือกแต่ผิด
                        btnStyle = "bg-red-100 border-red-500 text-red-800 opacity-70";
                    } else {
                        // ข้ออื่นๆ
                        btnStyle = "bg-white border-slate-200 text-slate-400 opacity-50";
                    }
                }

                optionsHtml += `
                    <button 
                        onclick="selectOption(${idx})" 
                        ${hasAnswered ? 'disabled' : ''} 
                        class="option-btn w-full text-left p-4 border-2 rounded-xl mb-3 ${btnStyle} ${hasAnswered ? 'cursor-default' : 'cursor-pointer'}">
                        <div class="flex items-center">
                            <span class="w-8 h-8 flex-shrink-0 rounded-full flex items-center justify-center border-2 mr-3 ${hasAnswered && idx === data.answer ? 'border-green-500 bg-green-500 text-white' : 'border-slate-300'}">${String.fromCharCode(65 + idx)}</span>
                            <span>${opt}</span>
                        </div>
                    </button>
                `;
            });

            // ส่วนแสดงคำอธิบาย (จะแสดงเมื่อตอบแล้ว)
            let feedbackHtml = '';
            if (hasAnswered) {
                const isCorrect = selectedIdx === data.answer;
                feedbackHtml = `
                    <div class="mt-6 p-5 rounded-xl ${isCorrect ? 'bg-green-50 border border-green-200' : 'bg-red-50 border border-red-200'} fade-in">
                        <div class="flex items-start">
                            <div class="flex-shrink-0 mt-0.5">
                                ${isCorrect 
                                    ? '<svg class="h-6 w-6 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>' 
                                    : '<svg class="h-6 w-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>'}
                            </div>
                            <div class="ml-3">
                                <h3 class="text-sm font-bold ${isCorrect ? 'text-green-800' : 'text-red-800'}">
                                    ${isCorrect ? 'ถูกต้อง!' : 'ยังไม่ถูกต้อง'}
                                </h3>
                                <div class="mt-2 text-sm text-slate-700 leading-relaxed">
                                    <strong>คำอธิบาย:</strong> ${data.explanation}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            appContainer.innerHTML = `
                <!-- Progress Bar -->
                <div class="w-full bg-slate-100 h-1.5">
                    <div class="bg-blue-500 h-1.5 transition-all duration-300" style="width: ${progressPct}%"></div>
                </div>
                
                <div class="p-6 md:p-8 fade-in">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-xs font-bold tracking-wider text-blue-600 uppercase bg-blue-100 py-1 px-3 rounded-full">ข้อที่ ${currentQuestionIndex + 1} / ${quizData.length}</span>
                    </div>
                    
                    <h2 class="text-lg md:text-xl font-semibold text-slate-800 mb-6 leading-relaxed">
                        ${data.question}
                    </h2>
                    
                    <div class="space-y-2">
                        ${optionsHtml}
                    </div>

                    ${feedbackHtml}

                    <div class="mt-8 flex justify-between items-center pt-6 border-t border-slate-100">
                        <button onclick="prevQuestion()" class="${currentQuestionIndex === 0 ? 'invisible' : ''} flex items-center text-slate-500 hover:text-slate-800 font-medium px-4 py-2 rounded-lg hover:bg-slate-100 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                            ย้อนกลับ
                        </button>
                        
                        ${hasAnswered ? `
                            <button onclick="nextQuestion()" class="flex items-center bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2.5 rounded-xl shadow-md transition">
                                ${currentQuestionIndex === quizData.length - 1 ? 'ดูผลคะแนน' : 'ข้อถัดไป'}
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                            </button>
                        ` : `
                            <div class="text-sm text-slate-400 italic">กรุณาเลือกคำตอบ</div>
                        `}
                    </div>
                </div>
            `;
        }

        // ฟังก์ชั่นเมื่อผู้ใช้เลือกคำตอบ
        function selectOption(selectedIndex) {
            if (userAnswers[currentQuestionIndex] !== null) return; // กันกดซ้ำ
            
            userAnswers[currentQuestionIndex] = selectedIndex;
            
            if (selectedIndex === quizData[currentQuestionIndex].answer) {
                score++;
            }
            
            renderQuestion(); // รีเรนเดอร์เพื่อโชว์เฉลยและคำอธิบาย
        }

        // ไปข้อถัดไป
        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                renderResultScreen();
            }
        }

        // ย้อนกลับ
        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        // หน้าแสดงผลลัพธ์
        function renderResultScreen() {
            const percentage = Math.round((score / quizData.length) * 100);
            let message = "";
            let icon = "";
            
            if (percentage >= 80) {
                message = "ยอดเยี่ยมมาก! คุณเข้าใจแนวคิดการออกแบบเครื่องจักรกลเป็นอย่างดี";
                icon = '<svg class="h-16 w-16 text-green-500 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>';
            } else if (percentage >= 50) {
                message = "ทำได้ดี! แต่ยังสามารถทบทวนเนื้อหาเพิ่มเติมได้อีกนิด";
                icon = '<svg class="h-16 w-16 text-yellow-500 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>';
            } else {
                message = "พยายามเข้านะ! แนะนำให้อ่านทบทวนเอกสารอีกครั้ง";
                icon = '<svg class="h-16 w-16 text-red-400 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>';
            }

            appContainer.innerHTML = `
                <div class="p-8 md:p-12 text-center fade-in">
                    <div class="mb-6">
                        ${icon}
                    </div>
                    <h2 class="text-3xl font-bold text-slate-800 mb-2">ผลการทดสอบ</h2>
                    <p class="text-slate-600 mb-8">${message}</p>
                    
                    <div class="bg-slate-50 rounded-2xl p-6 mb-8 border border-slate-100">
                        <div class="text-5xl font-extrabold text-blue-600 mb-2">${score} <span class="text-2xl text-slate-400">/ ${quizData.length}</span></div>
                        <div class="text-sm text-slate-500 font-medium">คิดเป็น ${percentage}%</div>
                    </div>
                    
                    <button onclick="startQuiz()" class="flex items-center justify-center mx-auto bg-slate-800 hover:bg-slate-900 text-white font-medium py-3 px-8 rounded-full transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                        ทำแบบทดสอบอีกครั้ง
                    </button>
                </div>
            `;
        }

        // เริ่มต้นแอป
        init();
    </script>
</body>
</html>
